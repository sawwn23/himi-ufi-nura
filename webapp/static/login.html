<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dongle · Log in</title>
<style>
:root{
  --bg:#f4f5f7;--panel:#fff;--ink:#16181d;--muted:#6b7280;--line:#e3e5ea;
  --accent:#2f6fed;--bad:#d1453b;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--panel:#171a21;--ink:#e7e9ee;--muted:#8b93a3;--line:#262a33;
  --accent:#6b9bff;--bad:#ff6b5f;color-scheme:dark;
}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
form{width:100%;max-width:320px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;gap:12px}
h1{font-size:16px;margin:0;font-weight:650}
input,button{font:inherit;color:inherit;width:100%;border-radius:8px;padding:9px 10px}
input{background:var(--bg);border:1px solid var(--line)}
input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
button{background:var(--accent);border:1px solid var(--accent);color:#fff;font-weight:550;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#err{color:var(--bad);font-size:13px;min-height:1.2em;margin:0}
</style>
</head>
<body>
<form id="f">
  <h1>LTE Dongle</h1>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus required>
  <button>Log in</button>
  <p id="err"></p>
</form>
<script>
const f = document.getElementById('f'), err = document.getElementById('err');
f.onsubmit = async e => {
  e.preventDefault();
  const btn = f.querySelector('button'); btn.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: document.getElementById('pw').value})});
    if (r.ok) { location.href = '/'; return; }
    err.textContent = (await r.json().catch(() => ({}))).error || r.statusText;
  } catch (e) { err.textContent = e.message; }
  btn.disabled = false;
};
</script>
</body>
</html>
