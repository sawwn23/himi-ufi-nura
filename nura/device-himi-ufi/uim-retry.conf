# Upstream script fails intermittently ("QMI protocol error: Internal" when resetting an
# already-selected app). ModemManager Requires= this unit, so a failure leaves the modem
# unmanaged. Retry a few times and never fail: with one physical SIM the modem selects it anyway.
[Service]
Type=oneshot
RemainAfterExit=yes
ExecStart=
ExecStart=/bin/sh -c 'for i in 1 2 3; do /usr/libexec/msm-modem-uim-selection && exit 0; echo "attempt $i failed, retrying"; sleep 3; done; echo "UIM selection failed 3 times; continuing so ModemManager still starts"'
